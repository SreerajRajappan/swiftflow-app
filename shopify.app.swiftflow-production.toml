# Production Configuration for SwiftFlow
client_id = "0d40a8f7944ea05b2170a6853a984afb"
name = "SwiftFlow: Local Delivery"
application_url = "https://swiftflow.logiclooms.io"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

[access_scopes]
scopes = "write_products,read_products,read_orders,write_orders,read_script_tags,write_script_tags,read_themes,write_themes,read_checkouts,write_checkouts,read_locations"

[auth]
redirect_urls = [
  "https://swiftflow.logiclooms.io/auth/callback",
  "https://swiftflow.logiclooms.io/auth/shopify/callback",
  "https://swiftflow.logiclooms.io/api/auth/callback"
]

[app_proxy]
url = "https://swiftflow.logiclooms.io/api"
subpath = "swiftflow-revenue"
prefix = "apps"

[[webhooks.subscriptions]]
  topics = [ "checkouts/update" ]
  uri = "/webhooks/checkouts/update"

[[webhooks.subscriptions]]
  topics = [ "orders/create" ]
  uri = "/webhooks/orders/create"