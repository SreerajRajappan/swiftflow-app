# Production Configuration for SwiftFlow
client_id = "0d40a8f7944ea05b2170a6853a984afb"
name = "SwiftFlow: Local Cart Recovery"
application_url = "https://swiftflow.logiclooms.io"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_locations,read_orders,read_checkouts,read_customers,write_app_proxy,write_products"

[auth]
redirect_urls = [
  "https://swiftflow-app.fly.dev/auth/callback",
  "https://swiftflow-app.fly.dev/auth/shopify/callback",
  "https://swiftflow-app.fly.dev/api/auth/callback"
]

[app_proxy]
url = "https://swiftflow.logiclooms.io/api"
subpath = "swiftflow-revenue"
prefix = "apps"

[[webhooks.subscriptions]]
  topics = [ "checkouts/update" ]
  uri = "/webhooks/checkouts/update"

[[webhooks.subscriptions]]
  topics = [ "orders/create" ]
  uri = "/webhooks/orders/create"