app = "swiftflow-app"
primary_region = "iad"

[env]
  PORT = "3000"
  HOST = "0.0.0.0" 
  SCOPES = "write_products,read_products,read_orders,write_orders,read_script_tags,write_script_tags,read_themes,write_themes,read_checkouts,write_checkouts"
  SHOPIFY_API_KEY = "c51a636b3f088fcdb03a770d4ee64992"
  SHOPIFY_APP_URL = "https://swiftflow.logiclooms.io"

[http_service]
  auto_start_machines = true
  auto_stop_machines = false
  force_https = true
  internal_port = 3000
  min_machines_running = 1
  processes = [ "app" ]

[[mounts]]
  auto_extend_size_increment = "1GB"
  auto_extend_size_limit = "10GB"
  auto_extend_size_threshold = 80
  destination = "/data"
  source = "data"

[processes]
  # 🚀 THE FIX: Drastically reduce boot time and memory. 
  # We only push the DB schema, and explicitly use --skip-generate 
  # to prevent the RAM-heavy client generation on every startup.
  app = "npx prisma db push --accept-data-loss --skip-generate && npm run start"

[[vm]]
  cpus = 1
  # 🚀 THE FIX: 1GB RAM Shield to ensure Remix and Prisma never hit the ceiling
  memory = "1024mb"
  memory_mb = 1024