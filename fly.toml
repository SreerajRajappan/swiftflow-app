app = "swiftflow-app"
primary_region = "iad"

# 🚀 THE FIX: Provisions the database tables BEFORE the main app boots, preventing the crash loop.
[deploy]
  release_command = "npx prisma db push --accept-data-loss --skip-generate"

[env]
  PORT = "3000"
  HOST = "0.0.0.0" 
  SCOPES = "write_products,read_products,read_orders,write_orders,read_script_tags,write_script_tags,read_themes,write_themes,read_checkouts,write_checkouts"
  SHOPIFY_API_KEY = "c51a636b3f088fcdb03a770d4ee64992"
  SHOPIFY_APP_URL = "https://swiftflow.logiclooms.io"

[http_service]
  auto_start_machines = true
  auto_stop_machines = false
  force_https = true
  internal_port = 3000
  min_machines_running = 1

[[mounts]]
  auto_extend_size_increment = "1GB"
  auto_extend_size_limit = "10GB"
  auto_extend_size_threshold = 80
  destination = "/data"
  source = "data"

[[vm]]
  cpus = 1
  memory = "1024mb"
  memory_mb = 1024

[processes]
cron = "node -e \"fetch('[your-app.fly.dev](https://your-app.fly.dev/api/cron/carts)', { method: 'POST', headers: { Authorization: 'Bearer ' + process.env.CRON_SECRET } })\""